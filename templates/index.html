<!DOCTYPE html>
<html>

<head>
    <title>AI Assistant</title>
</head>

<body>

    <h1>DataSmith AI Assistant</h1>

    <form action="/chat" method="post" enctype="multipart/form-data">

        <input
            type="text"
            name="message"
            placeholder="Enter message"
        >

        <br><br>

        <input type="file" name="file">

        <br><br>

        <button type="submit">
            Send
        </button>

    </form>

</body>

</html>
